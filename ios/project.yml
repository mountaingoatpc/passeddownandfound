name: Atticory
options:
  bundleIdPrefix: com.atticory
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Atticory:
    type: application
    platform: iOS
    sources:
      - path: Atticory
        excludes:
          - Info.plist
          - Resources/**
    resources:
      - path: Atticory/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.atticory.app
        INFOPLIST_FILE: Atticory/Info.plist
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        SWIFT_STRICT_CONCURRENCY: minimal
    configFiles:
      Debug: Configs/Debug.xcconfig
      Release: Configs/Release.xcconfig
    scheme:
      testTargets: []
